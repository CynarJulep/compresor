# Mantiene despierta la app en Streamlit Community Cloud.
# Hiberna tras ~12 h sin tráfico de usuario. Un curl NO alcanza:
# hace falta un navegador (JS + WebSocket). El botón Wake no sirve
# bien dentro del iframe de Google Sites.
name: Keep Streamlit awake

on:
  schedule:
    # Cada 6 h (UTC) — margen frente a las 12 h de hibernación
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Open app (wake if sleeping)
        env:
          APP_URL: https://compresorsac.streamlit.app/
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          import os, sys, time, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          print(f"Opening {url}", flush=True)

          def looks_awake(page) -> bool:
              title = (page.title() or "").lower()
              if "compresor" in title or "atención" in title or "atencion" in title:
                  return True
              # Marcadores típicos de Streamlit ya montado
              for sel in (
                  "[data-testid='stApp']",
                  "[data-testid='stAppViewContainer']",
                  "#root [class*='stApp']",
                  "iframe[title*='streamlit']",
              ):
                  try:
                      if page.locator(sel).count() > 0:
                          return True
                  except Exception:
                      pass
              html = page.content().lower()
              if "data-testid=\"stapp\"" in html.replace("'", '"'):
                  return True
              if "compresor de archivos" in html:
                  return True
              return False

          def click_wake(page) -> bool:
              # Botón oficial + variantes por texto
              patterns = [
                  page.get_by_role("button", name=re.compile(r"get this app back", re.I)),
                  page.locator("button:has-text('get this app back')"),
                  page.locator("a:has-text('get this app back')"),
                  page.locator("text=/Yes,? get this app back up!?/i"),
              ]
              for loc in patterns:
                  try:
                      if loc.count() > 0:
                          print(f"Sleeping — clicking wake: {loc.first}", flush=True)
                          loc.first.click(timeout=15_000)
                          time.sleep(10)
                          return True
                  except Exception as e:
                      print(f"wake click skip: {e}", flush=True)
              return False

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/122.0.0.0 Safari/537.36"
                  ),
                  locale="es-AR",
              )
              page = context.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=120_000)
              time.sleep(5)

              woke = click_wake(page)
              if woke:
                  page.wait_for_load_state("domcontentloaded", timeout=120_000)
                  time.sleep(5)

              ok = False
              for i in range(30):
                  title = page.title()
                  awake = looks_awake(page)
                  print(f"[{i}] title={title!r} awake={awake}", flush=True)
                  if awake:
                      # Mantener la sesión un poco para que cuente como tráfico
                      time.sleep(20)
                      ok = True
                      break
                  # Reintentar wake si aparece más tarde
                  click_wake(page)
                  time.sleep(5)

              # Evidencia si falla
              if not ok:
                  page.screenshot(path="keepalive-fail.png", full_page=True)
                  with open("keepalive-fail.html", "w", encoding="utf-8") as f:
                      f.write(page.content())
                  print("Saved keepalive-fail.png / .html", flush=True)

              browser.close()
              sys.exit(0 if ok else 1)
          PY

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-debug
          path: |
            keepalive-fail.png
            keepalive-fail.html
          if-no-files-found: ignore

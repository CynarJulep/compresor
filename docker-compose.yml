name: compresor

services:
  compresor:
    build: .
    container_name: compresor-sac
    restart: unless-stopped
    ports:
      - "${COMPRESOR_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      PYTHONUNBUFFERED: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/', timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s
